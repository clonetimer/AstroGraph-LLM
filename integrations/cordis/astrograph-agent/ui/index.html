<!doctype html><meta charset="utf-8"><title>AstroGraph Agent Workflow</title>
<style>body{font:14px system-ui;margin:2rem;background:#0f172a;color:#e2e8f0}h1{font-size:1.35rem}.meta{color:#94a3b8}.dag{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}.node{padding:.7rem 1rem;border:1px solid #475569;border-radius:.55rem;background:#1e293b}.arrow{color:#38bdf8}.warn{margin-top:1rem;padding:.8rem;border-left:4px solid #f59e0b;background:#292115}</style>
<h1>AstroGraph persistent workflow viewer</h1><p class="meta" id="meta"></p><div class="dag" id="dag"></div><div class="warn">Structural DAG validity is not scientific validity. Diagnostic execution remains governed by the atomic AstroGraphRuntime boundary.</div>
<script type="module">const q=new URLSearchParams(location.search);const src=q.get('workflow')||'../../../../configs/agentization/workflows/astrograph-diagnosis-v1.json';const w=await fetch(src).then(r=>r.json());meta.textContent=`${w.workflow_id} · ${w.profile} · ${w.project_status}`;const d=document.querySelector('#dag');w.nodes.forEach((n,i)=>{const x=document.createElement('div');x.className='node';x.textContent=n.id;d.append(x);if(i<w.nodes.length-1){const a=document.createElement('span');a.className='arrow';a.textContent='→';d.append(a)}});</script>

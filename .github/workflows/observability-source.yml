name: External analysis source regression
on:
  push:
    branches: [feat/pilotdeck-observability, feat/platform-persistent-queue]
    paths:
      - 'src/astrograph/**'
      - 'portable/**'
      - 'tests/test_p3_platform*'
      - 'tests/test_p2_context_platform.py'
      - '.github/workflows/observability-source.yml'
  pull_request:
    branches: [feat/portable-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-22.04
            python: '3.11'
          - os: windows-2022
            python: '3.8'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned portable test dependencies
        run: python -m pip install pydantic==2.10.6 pydantic-core==2.27.2 annotated-types==0.7.0 typing-extensions==4.13.2 eval-type-backport==0.2.2 pypdf==5.9.0 reportlab==4.4.3 certifi
      - name: Source portable regression
        run: python -B -m unittest discover -s portable -p "test*.py" -v
  platform:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development and browser test dependencies
        run: |
          python -m pip install -e '.[platform,test]'
          python -m pip install 'pypdf==5.9.0' 'reportlab==4.4.3' 'playwright==1.56.0'
      - name: External analysis P0-P3, context, citations and UI regression
        run: |
          python -m pytest -q --astrograph-test-profile source-only \
            tests/test_external_diagnosis_analysis.py \
            tests/test_external_diagnosis_platform.py \
            tests/test_external_diagnosis_conversation.py \
            tests/test_external_execution_observability.py \
            tests/test_p2_context_platform.py \
            tests/test_p3_platform_phase_models.py \
            tests/test_p3_platform_long_stages.py \
            tests/ui/test_p3_platform_phase_ui.py \
            tests/ui/test_p3_platform_long_stage_ui.py \
            tests/ui/test_execution_views_integration.py \
            tests/ui/test_external_diagnosis_ui_input.py
          node --check src/astrograph/resources/mission_console.js

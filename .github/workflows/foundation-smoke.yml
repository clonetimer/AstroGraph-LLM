name: Foundation smoke (source-only)
on:
  push:
    branches: [dev/foundation-r11-integration]
  pull_request:
    branches: [main]
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[platform,test]"
      - name: Source-only smoke tests
        run: |
          python -m pytest -q --astrograph-test-profile source-only \
            tests/test_candidate_selection.py \
            tests/test_pre_reasoning_retrieval.py \
            tests/test_foundation_r3_literature_bidirectional.py \
            tests/test_foundation_r4_competition_claim_guard.py

name: Apply audited full-platform P3 stage models
on:
  push:
    branches: [feat/pilotdeck-observability]
    paths:
      - '.sync/p3-platform-long-stage.patch'
      - '.github/workflows/apply-p3-long-stage.yml'
permissions:
  contents: write
jobs:
  validate-and-apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Guard source baseline and verify exact incremental patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d72fc11e22cfd5325ff38e8e18f7d4d9e76082df HEAD
          changed="$(git diff --name-only d72fc11e22cfd5325ff38e8e18f7d4d9e76082df HEAD | grep -v '^.sync/p3-platform-long-stage.patch$' | grep -v '^.github/workflows/apply-p3-long-stage.yml$' || true)"
          test -z "$changed" || { echo 'Unexpected previous changes'; echo "$changed"; exit 1; }
          echo '7c598b2b682a3343f648c71ae3bdd7da7c563a2f8de022619a38804c03ee3964  .sync/p3-platform-long-stage.patch' | sha256sum -c -
          git apply --check .sync/p3-platform-long-stage.patch
      - name: Apply P3 long-stage increment
        run: git apply .sync/p3-platform-long-stage.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[platform,test]'
          python -m pip install 'pypdf==5.9.0' 'reportlab==4.4.3'
      - name: Verify full-platform stage models, citations and existing flows
        run: |
          python -m pytest -q --astrograph-test-profile source-only \
            tests/test_p3_platform_phase_models.py \
            tests/test_p3_platform_long_stages.py \
            tests/ui/test_p3_platform_phase_ui.py \
            tests/ui/test_p3_platform_long_stage_ui.py \
            tests/test_external_diagnosis_analysis.py \
            tests/test_external_diagnosis_platform.py \
            tests/test_external_diagnosis_conversation.py \
            tests/ui/test_external_diagnosis_ui_input.py \
            tests/test_external_execution_observability.py \
            tests/test_p2_context_platform.py
          node --check src/astrograph/resources/mission_console.js
      - name: Publish tested source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add pinned chunk and synthesis models to full platform'
          git push origin HEAD:refs/heads/feat/pilotdeck-observability

schema_version: phm.fault_contract.v1
fault_id: ADCS_RW_TORQUE_AUTHORITY_LOSS
name_zh: 反作用轮电机力矩能力丧失
subsystem: ADCS
component: reaction_wheel_0
fault_type: fault
mechanism: 目标轮可用电机力矩按比例下降，处理后的施加力矩进入反作用轮动力学。
injection_target: ReactionWheelCommandFaultManager.adcs_rw_motor_failure
parameters:
  wheel_index:
    unit: index
    nominal: 0
    range: [0, 2]
  torque_scale:
    unit: '1'
    nominal: 0.2
    range: [0.0, 0.5]
direct_channels:
  - status.adcs.rw.available_0
  - status.adcs.rw.driver_code_0
component_response_channels:
  - estimate.adcs.rw.actual_torque_nm_0
  - sensor.adcs.rw.motor_current_a_0
  - sensor.adcs.rw.speed_rad_s_0
subsystem_propagation_channels:
  - sensor.adcs.gyro_rate_rad_s_x
  - sensor.adcs.gyro_rate_rad_s_y
  - sensor.adcs.gyro_rate_rad_s_z
confusable_faults:
  - ADCS_RW_JAM
  - ADCS_RW_FRICTION_INCREASE
supported_conditions:
  - attitude_maneuver
  - steady_pointing_with_nonzero_torque_command
evidence_level: E0
source: engineering_assumption
acceptance:
  expected_signal: estimate.adcs.rw.actual_torque_nm_0
  expected_direction: decrease_in_absolute_value
  minimum_delta: 0.01
  unit: N*m
known_limits:
  - 状态字由项目故障管理器和虚拟传感器生成，不代表具体厂商驱动器协议。
  - 电机电流为代数虚拟传感器，尚未反馈到 EPS 母线。
  - 本合同验证力矩能力损失，不进一步声称绕组开路或驱动器硬件根因。

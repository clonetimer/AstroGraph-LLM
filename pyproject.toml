[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrograph-core"
version = "0.7.1.post49"
description = "AstroGraph evidence-driven satellite fault diagnosis"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic>=2.10,<3",
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "jsonschema>=4.23,<5",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
external-evaluation = ["xlrd>=2.0.2,<3"]
agent = ["langgraph==1.2.11", "langchain==1.4.0"]
langgraph = ["langgraph>=0.2,<2"]
neo4j = ["neo4j>=5,<7"]
mcp = ["mcp>=2,<3"]
secrets = ["keyring>=25,<27"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
platform = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
  "packaging>=24,<27",
]
ml = ["scikit-learn>=1.5,<2", "scipy>=1.13,<2"]
retrieval = ["sentence-transformers>=3,<6", "transformers>=4.50,<6"]
retrieval-qdrant = ["qdrant-client>=1.12,<3"]
retrieval-docling = ["docling>=2,<4"]
deep-learning = ["torch>=2.2,<3", "numpy>=2.0,<3"]
tokenizer = ["transformers>=4.50,<6"]
dev = ["PyYAML>=6,<7", "packaging>=24,<27"]

[project.scripts]
astrograph = "astrograph.cli:main"
astrograph-oag = "astrograph.oag.cli:main"
astrograph-agent = "astrograph.agents.mission.cli:main"
astrograph-training = "astrograph.training.cli:main"
astrograph-lifecycle = "astrograph.lifecycle.cli:main"
astrograph-upstream = "astrograph.upstream.cli:main"
astrograph-platform = "astrograph.integrations.platform_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.setuptools.package-data]
astrograph = ["resources/*.json", "resources/*.html", "resources/*.css", "resources/*.js"]
